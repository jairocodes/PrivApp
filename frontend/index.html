<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de análisis de políticas de privacidad para jóvenes de San José Acatempa, Jutiapa." />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)" />
    <title>PrivApp — Análisis de Políticas de Privacidad</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello claro.
      // Debe coincidir con context/TemaContext.tsx (clave y valores).
      try {
        var preferencia = localStorage.getItem('privapp-tema')
        var oscuro = preferencia === 'oscuro' ||
          (preferencia !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
